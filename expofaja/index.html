      <p>Programa oficial de la CCIEB. Horarios y salas sujetos a cambios del organizador.</p>
      <h2>Jueves 15 de octubre</h2>
      <ul>
        <li>17:00-20:00 · Acto de inauguración: corte de cinta, recorrido institucional por el área expositiva, acto cultural y brindis</li>
      </ul>

      <ul>
        <li>08:00-20:00 · Apertura de exposiciones en áreas asignadas</li>

        <li>10:00-11:00 · Sala 5 · Atracción de la inversión privada y las políticas públicas · Abg. Julio Pérez Graterol</li>
        <li>11:00-12:00 · Sala 5 · El futuro de la Faja Petrolífera del Orinoco frente a los desafíos de la economía venezolana en la actualidad · Eco. Jesús Farías</li>
        <li>12:00-14:00 · Pausa / coffee break</li>
        <li>14:00-15:00 · Sala 5 · La inteligencia artificial y la ciberseguridad en el campo comercial · Dip. Jehyson Guzmán</li>
        <li>15:00-16:00 · Sala 5 · El desafío energético: generar valor en la industria petrolera, gerenciando los riesgos de manera inteligente · Ing. José Manuel Linares Gabaldón</li>
        <li>16:00-17:00 · Sala 5 · Mesa de trabajo: la academia y las empresas petroleras, participación especial de exponentes</li>

        <li>19:00-20:00 · Cierre de la jornada</li>
      </ul>

      <ul>
        <li>08:00-20:00 · Apertura de exposiciones en áreas asignadas</li>
