# P5 de la auditoria de septiembre y parte de M8 (Notion, *Funcionalidad v2*):
# tests con node:test, sin dependencias. Ver docs/DECISIONS.md -> ADR-016.
#
# Desde ADR-019, `npm test` tambien corre scripts/verificar-modulos.mjs (gate
# de arquitectura: solo map.js importa "cesium", la interfaz no hace fetch).
# Mismo motivo para vivir aqui y no en un workflow aparte: sin dependencias,
# rapido, y es exactamente el tipo de comprobacion que ya vive en este job.
#
# Como validar-datos.yml, no hace `npm install`: los tests solo importan
# modulos sin dependencias (data.js, config.js) y los diccionarios.
# test/entorno.mjs usa module.registerHooks, que pide Node 22.15 o superior.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests (data.js, i18n, rutas de datos, validador, controlador de render) + gate de arquitectura
        run: npm test
